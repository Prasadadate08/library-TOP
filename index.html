<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="myjs.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="left-bg">
            <h1>My Book Library</h1>
            <img src="assets/emil-widlund-xrbbXIXAWY0-unsplash.jpg" alt="">
            <p>Photo by <a href="https://unsplash.com/photos/photo-of-brown-wooden-bookshelf-xrbbXIXAWY0">Emil Widlund</a> on <a href="https://unsplash.com">Unsplash</a></p>
        </div>

        <div class="right-side">
            <div class="collection-heading">
                <h2>Books Collection</h2>
            </div>

            <div class="new-book">
                <button command="show-modal" commandfor="dialog-form">New Book</button>
            </div>

            <div class="books list">

            </div>
        </div>

        
        <dialog id="dialog-form">
            <form action="">

                <p>Please add the details as below for your book.</p>
                <fieldset class="form-details">

                    <div class="form-row">
                        <label for="title">Title*</label>
                        <input type="text" name="title" id="title" required>
                    </div>
                    
                    <div class="form-row">
                        <label for="author">Author*</label>
                        <input type="text" name="author" id="author" required>
                    </div>
                    
                    <div class="form-row">
                        <label for="pages">Pages*</label>
                        <input type="number" name="pages" id="pages" required>
                    </div>
                    
                    <div class="form-row">
                        <label for="status">Read status</label>
                        <input type="checkbox" name="status" id="status">
                    </div>

                </fieldset>
                          
                <div class="action-button">
                    <button class="addBook" type="submit">Submit Book</button>
                </div>

            </form>

        </dialog>

    </div>
</body>
</html>
